<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחולל השוואת מסלולים | קפלן דהאן</title>
<style>
  :root{
    --ink:#132430; --paper:#F5F1E8; --muted:#5B6B70;
    --accent:#1F5F52; --accent-tint:#E4EEEA;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif; line-height:1.5;}
  .num{font-variant-numeric:tabular-nums;}
  header.hero{padding:22px 5vw 20px; border-bottom:3px solid var(--ink); background:var(--ink); color:var(--paper);}
  .logo-row img{height:38px; width:auto; border-radius:8px; background:#fff; padding:4px 8px;}
  h1{font-size:clamp(19px,5vw,28px); margin:12px 0 0; font-weight:800; color:var(--paper);}
  .tabs{display:flex; gap:8px; margin-top:16px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:4px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{font-family:inherit; font-size:13.5px; font-weight:700; border:2px solid var(--paper); border-radius:999px;
    padding:10px 18px; background:transparent; cursor:pointer; color:var(--paper); white-space:nowrap; flex:0 0 auto;
    min-height:40px;}
  .tab-btn.active{background:var(--paper); color:var(--ink);}
  main{padding:18px 5vw 32px;}
  .controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  select{font-family:inherit; font-size:16px; border:1.5px solid var(--ink); border-radius:999px; padding:11px 18px;
    background:#fff; cursor:pointer; width:100%; min-height:44px;}
  .table-wrap{overflow-x:auto; border:2px solid var(--ink); border-radius:16px; background:#fff; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; width:100%; min-width:560px; font-size:14px;}
  thead th{background:#0A161D; color:var(--paper); text-align:start; padding:12px 14px; position:sticky; top:0;}
  thead th.sortable{cursor:pointer; user-select:none; min-height:44px;}
  thead th.sortable:hover{background:#16242f;}
  thead th.sortable.active{text-decoration:underline;}
  tbody td, tbody th{padding:12px 14px; border-top:1px solid #e3ddc9; text-align:start;}
  tbody th{font-weight:700; font-size:13px;}
  tbody th.co-name{cursor:pointer; color:var(--accent); text-decoration:underline dotted;}
  tbody th.co-name:hover{color:#143c33;}
  tbody tr:hover{background:#faf7ee;}
  tbody tr.best{background:var(--accent-tint);}
  .medal{font-size:10.5px; background:var(--accent); color:#fff; border-radius:999px; padding:2px 7px; margin-inline-start:6px;}
  /* sticky first column so the company name stays visible while scrolling the periods horizontally */
  thead th:first-child, tbody th:first-child{
    position:sticky; right:0; background:#0A161D; z-index:2; box-shadow:-6px 0 8px -6px rgba(0,0,0,.25);
  }
  tbody th:first-child{background:#fff;}
  tbody tr.best th:first-child{background:var(--accent-tint);}
  footer{padding:16px 5vw 26px; color:var(--muted); font-size:11.5px;}
  a{color:var(--accent);}
  @media (max-width:520px){
    h1{font-size:19px;}
    .tab-btn{font-size:12.5px; padding:9px 14px;}
    table{font-size:13px; min-width:480px;}
    thead th, tbody td, tbody th{padding:10px 10px;}
    select{font-size:15px;}
    .lead-form{padding:18px;}
    .lead-form .row{flex-direction:column; align-items:stretch;}
    .lead-form input, .lead-form button{width:100%;}
  }
  /* lead capture */
  .lead{margin:28px 5vw 0; border:2px solid var(--ink); border-radius:16px; background:#fff; padding:22px 24px; text-align:center;}
  .lead h3{margin:0 0 6px; font-size:18px;}
  .lead p{margin:0 0 16px; color:var(--muted); font-size:13.5px;}
  .lead .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .lead input{font-family:inherit; font-size:15px; border:1.5px solid var(--ink); border-radius:999px; padding:11px 16px; min-width:170px;}
  .lead button{font-family:inherit; font-size:15px; font-weight:700; border:none; border-radius:999px; padding:11px 26px;
    background:var(--accent); color:#fff; cursor:pointer;}
  .lead button:hover{background:#164a40;}
  .lead .msg{margin-top:12px; font-size:13.5px;}
  .lead .msg.ok{color:var(--accent);}
  .lead .msg.err{color:#9c3f2a;}
</style>
</head>

const fmt = v => v===null||v===undefined ? '—' : (v>0?'+':'') + v.toFixed(2) + '%';
let currentTab = 'policy';
let sortCol = 3;

function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = Object.keys(productData).map((k,i)=>`<button class="tab-btn ${i===0?'active':''}" data-p="${k}">${productData[k].label}</button>`).join('');
  wrap.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      wrap.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setupProduct(btn.dataset.p);
    });
  });
  setupProduct('policy');
}

function setupProduct(key){
  currentTab = key;
  sortCol = 3;
  viewMode = 'track';
  selectedCompany = null;
  const data = productData[key].returns;
  const cats = [...new Set(data.map(r=>r[1]))];
  const sel = document.getElementById('catSelect');
  sel.style.display = '';
  sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value = cats.includes('כללי') ? 'כללי' : cats[0];
  sel.onchange = () => drawReturns();
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('backBtn').onclick = () => { viewMode='track'; setupProduct(currentTab); };
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.onclick = () => { sortCol = parseInt(th.dataset.col,10); drawReturns(); };
  });
  drawReturns();
}

function showCompany(company){
  viewMode = 'company';
  selectedCompany = company;
  sortCol = 3;
  document.getElementById('catSelect').style.display = 'none';
  document.getElementById('backBtn').style.display = '';
  drawReturns();
}

function drawReturns(){
  const data = productData[currentTab].returns;
  const colHead0 = document.getElementById('colHead0');

  if (viewMode === 'company') {
    const rows = data.filter(r=>r[0]===selectedCompany).sort((a,b)=>(b[sortCol]??-999)-(a[sortCol]??-999));
    colHead0.textContent = `${selectedCompany} — כל המסלולים`;
    document.querySelectorAll('th.sortable').forEach(th=>{
      th.classList.toggle('active', parseInt(th.dataset.col,10)===sortCol);
    });
    document.getElementById('returnsBody').innerHTML = rows.map(r=>`
      <tr>
        <th>${r[1]}</th>
        <td class="num">${fmt(r[2])}</td><td class="num">${fmt(r[3])}</td><td class="num">${fmt(r[4])}</td><td class="num">${fmt(r[5])}</td>
      </tr>`).join('');
    return;
  }

  colHead0.textContent = 'חברה / גוף מנהל';
  const cat = document.getElementById('catSelect').value;
  const rows = data.filter(r=>r[1]===cat).sort((a,b)=>(b[sortCol]??-999)-(a[sortCol]??-999));
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.classList.toggle('active', parseInt(th.dataset.col,10)===sortCol);
  });
  document.getElementById('returnsBody').innerHTML = rows.map((r,i)=>`
    <tr class="${i===0?'best':''}">
      <th class="co-name" data-company="${r[0]}">${r[0]}${i===0?'<span class="medal">מוביל</span>':''}</th>
      <td class="num">${fmt(r[2])}</td><td class="num">${fmt(r[3])}</td><td class="num">${fmt(r[4])}</td><td class="num">${fmt(r[5])}</td>
    </tr>`).join('');
  document.querySelectorAll('th.co-name').forEach(th=>{
    th.onclick = () => showCompany(th.dataset.company);
  });
}

let viewMode = 'track';
let selectedCompany = null;

// Live data source: once the monthly updater (see /gemelnet-updater) is deployed,
// set this to the returned Vercel Blob URL. Until then, or if the fetch fails,
// the tool keeps using the built-in snapshot above — it never breaks.
const LIVE_DATA_URL = ''; // e.g. 'https://xxxxx.public.blob.vercel-storage.com/gemel-data.json'
let lastUpdatedLabel = null;

async function loadLiveData(){
  if (!LIVE_DATA_URL) return;
  try {
    const res = await fetch(LIVE_DATA_URL, { cache: 'no-store' });
    if (!res.ok) return;
    const payload = await res.json();
    if (payload && payload.productData) {
      Object.assign(productData, payload.productData);
      lastUpdatedLabel = payload.updatedAt;
      renderTabs(); // re-render with fresh data
    }
  } catch (e) {
    // silent fallback to the built-in snapshot
    console.warn('live data fetch failed, using built-in snapshot', e);
  }
}

renderTabs();
loadLiveData();

// Lead capture — Web3Forms (same access key already used on kd-ins.co.il's other lead-gen tools)
document.getElementById('leadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const msg = document.getElementById('leadMsg');
  const btn = form.querySelector('button');
  const data = new FormData(form);
  data.append('access_key', '3196d164-1737-4d2b-b915-475e7d224172');
  data.append('subject', 'ליד חדש - מחולל השוואת מסלולים');
  data.append('from_name', 'מחולל השוואת מסלולים - קפלן דהאן');

  btn.disabled = true;
  btn.textContent = 'שולח...';
  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: data,
    });
    const result = await res.json();
    if (result.success) {
      msg.textContent = 'תודה! ניצור איתך קשר בקרוב.';
      msg.className = 'msg ok';
      form.reset();
    } else {
      throw new Error(result.message || 'unknown error');
    }
  } catch (err) {
    msg.textContent = 'משהו השתבש — נסו שוב או צרו קשר ישירות.';
    msg.className = 'msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'שלח פרטים';
  }
});
